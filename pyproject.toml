[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-voice-chat-ai-receptionist"
version = "2.2.0"
description = "Enterprise Omnichannel AI Voice & Chat Receptionist powered by Vapi, FastAPI, Qdrant Hybrid RAG, Google Calendar 2-Way Sync, and Meta/WhatsApp/Instagram/LinkedIn Webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kishor Kumar Paroi", email = "kishor@kishor.tech"}
]
keywords = [
    "voice-ai", "vapi", "webrtc", "omnichannel", "fastapi", "rag", 
    "qdrant", "whatsapp-bot", "facebook-messenger", "instagram-direct", 
    "linkedin-api", "google-calendar", "cartesia", "deepgram", "langfuse"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.8.0",
    "openai>=1.14.0",
    "google-api-python-client>=2.122.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "langfuse>=2.20.0",
    "psycopg2-binary>=2.9.9",
    "openpyxl>=3.1.2"
]

[project.urls]
Homepage = "https://ai-voice-receptionist.kishor.tech/"
Documentation = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist#readme"
Repository = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist.git"
Issues = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
