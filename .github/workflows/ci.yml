name: Enterprise CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: 🔍 Static Code Analysis & Linting (Ruff)
        run: |
          ruff check . --ignore E501,E402,F401,F841

      - name: 🧪 Execute Omnichannel Test Suite
        env:
          TESTING: "true"
          USE_RAG: "false"
          DEFAULT_TENANT_ID: "salon"
          DEFAULT_ACCENT: "red_american"
          META_VERIFY_TOKEN: "omnichannel_secure_token_123"
        run: |
          pytest tests/ -v --maxfail=1

      - name: 🛡️ Leak & Secret Prevention Audit
        run: |
          # Verify no private keys or high-entropy secrets are checked into git
          if grep -rn "BEGIN RSA PRIVATE KEY\|BEGIN PRIVATE KEY" --exclude-dir=".venv" --exclude-dir=".git" .; then
            echo "❌ CRITICAL: Unencrypted private key found in codebase!"
            exit 1
          fi
          echo "✅ Secret scanning passed cleanly."

