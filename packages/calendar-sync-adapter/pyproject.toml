[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-sync-adapter"
version = "2.2.0"
description = "Two-Way Google Calendar & CalDAV scheduling engine with slot availability calculation and conflict resolution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kishor Kumar Paroi", email = "kishor@kishor.tech"}
]
keywords = ["google-calendar", "scheduling", "appointment-booking", "availability-engine"]
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist"
