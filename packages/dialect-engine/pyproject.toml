[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-dialect-engine"
version = "2.2.0"
description = "Zero-latency lexical & acoustic dialect detection and regional English adaptation engine for Voice AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kishor Kumar Paroi", email = "kishor@kishor.tech"}
]
keywords = ["dialect-detection", "accent-switching", "voice-ai", "acoustics", "tts"]
dependencies = [
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist"
