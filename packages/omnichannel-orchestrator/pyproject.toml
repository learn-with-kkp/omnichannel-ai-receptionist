[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-orchestrator"
version = "2.2.0"
description = "Universal Conversational Dialogue State Machine and Microsecond Latency Waterfall Tracker for AI Receptionists"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kishor Kumar Paroi", email = "kishor@kishor.tech"}
]
keywords = ["voice-ai", "orchestrator", "vapi", "fastapi", "dialogue-management"]
dependencies = [
    "pydantic>=2.0.0",
    "langfuse>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist"
Documentation = "https://ai-voice-receptionist.kishor.tech/"
Repository = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist.git"
