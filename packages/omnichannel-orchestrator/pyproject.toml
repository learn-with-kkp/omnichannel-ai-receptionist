[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnichannel-orchestrator"
version = "2.2.0"
description = "Core dialogue state machine, microsecond latency profiler, and multi-tenant conversational router"
authors = [{ name = "Kishor Kumar Paroi", email = "1703053@student.ruet.ac.bd" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "qdrant-client>=1.7.0"
]

[project.urls]
Homepage = "https://ai-voice-receptionist.kishor.tech"
Repository = "https://github.com/KishorKumarParoi/omnichannel-voice-chat-ai-receptionist"
